<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Sections</title>
<style>
  :root {
    --bg: #f7f6f3;
    --card-bg: #ffffff;
    --border: #ddd8cd;
    --text: #2b2a28;
    --muted: #7a756c;
    --accent: #3c5a4a;
    --accent-light: #eef2ee;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }
  .wrap { width: 100%; max-width: 720px; }
  h1 {
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0.2px;
    margin: 0 0 6px;
    text-align: center;
    color: var(--text);
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    margin: 0 0 36px;
    font-family: Georgia, serif;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 22px 20px;
    cursor: pointer;
    color: var(--text);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .card:hover {
    border-color: var(--accent);
    background: var(--accent-light);
  }
  .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .folder-icon { flex: 0 0 auto; width: 40px; height: 34px; }
  .folder-icon svg { width: 100%; height: 100%; display: block; }
  .card-label { font-size: 18px; font-family: Georgia, serif; }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Last Attempt</h1>
    <p class="subtitle">Clerk Mains Topic Wise Practice</p>
    <div class="grid" id="cardGrid"></div>
  </div>

  <script>
    // Edit the "url" for each section below to point wherever you like.
    const sections = [
      { label: "Quant",           url: "https://example.com/quant" },
      { label: "Reasoning",       url: "https://example.com/reasoning" },
      { label: "English",        url: "https://example.com/english" },
      { label: "Current Affairs", url: "https://example.com/current-affairs" }
    ];

    const folderSVG = `
      <svg viewBox="0 0 24 20" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 3.5C1 2.12 2.12 1 3.5 1H8.6c.66 0 1.28.32 1.66.87L11.6 3.6c.19.27.5.43.82.43H20.5C21.88 4 23 5.12 23 6.5v10C23 17.88 21.88 19 20.5 19h-17C2.12 19 1 17.88 1 16.5v-13Z"
              fill="none" stroke="#3c5a4a" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>`;

    const grid = document.getElementById("cardGrid");

    sections.forEach(section => {
      const card = document.createElement("div");
      card.className = "card";
      card.setAttribute("role", "button");
      card.setAttribute("tabindex", "0");
      card.innerHTML = `
        <span class="folder-icon">${folderSVG}</span>
        <span class="card-label">${section.label}</span>
      `;

      const go = () => { window.location.href = section.url; };

      card.addEventListener("click", go);
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          go();
        }
      });

      grid.appendChild(card);
    });
  </script>
</body>
</html>
